name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

# A new push cancels a run that is still going for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same time zone as the clinic and the developer's machine.
  TZ: Europe/Stockholm

jobs:
  backend:
    name: Backend (lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: puls_user
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: puls_ci
        ports:
          - 5432:5432
        # Wait until the database accepts connections before the steps start.
        options: >-
          --health-cmd "pg_isready -U puls_user -d puls_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://puls_user:ci-password@localhost:5432/puls_ci?schema=public
      # Only used for tokens inside this test run.
      JWT_SECRET: ci-only-secret-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Prisma client
        run: npx prisma generate

      - name: Database (migrate and seed)
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  frontend:
    name: Frontend (lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check conventions
        run: |
          # queryFn must call the service through an arrow function (CLAUDE.md).
          if grep -rnE "queryFn: [a-zA-Z]+[,}]" src; then
            echo "queryFn must call the service through an arrow function, e.g. () => getX()"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
